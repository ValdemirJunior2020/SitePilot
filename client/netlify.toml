[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://sitepilot-api.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://sitepilot-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.production.environment]
  VITE_API_URL = "https://sitepilot-api.onrender.com"

[context.deploy-preview.environment]
  VITE_API_URL = "https://sitepilot-api.onrender.com"

[context.branch-deploy.environment]
  VITE_API_URL = "https://sitepilot-api.onrender.com"